<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dev Core — قريباً</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --purple-deep: #1e0a3c;
        --purple-mid: #2d1060;
        --purple-light: #4a1a9e;
        --gold: #f5a623;
        --gold-light: #ffc85a;
        --white: #ffffff;
        --white-muted: rgba(255, 255, 255, 0.65);
      }

      html,
      body {
        height: 100%;
        font-family: "Cairo", sans-serif;
        background: var(--purple-deep);
        color: var(--white);
        overflow-x: hidden;
      }

      /* ── BACKGROUND ── */
      .bg-wrap {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: radial-gradient(
          ellipse 80% 70% at 50% 0%,
          #3b1280 0%,
          #1e0a3c 55%,
          #0d0420 100%
        );
      }
      .bg-wrap::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(
            circle 1px at 20% 30%,
            rgba(245, 166, 35, 0.35) 0%,
            transparent 100%
          ),
          radial-gradient(
            circle 1px at 80% 70%,
            rgba(245, 166, 35, 0.2) 0%,
            transparent 100%
          );
        background-size:
          160px 160px,
          220px 220px;
        opacity: 0.6;
      }
      /* floating orbs */
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        pointer-events: none;
        animation: float linear infinite;
      }
      .orb1 {
        width: 380px;
        height: 380px;
        background: rgba(90, 30, 180, 0.45);
        top: -80px;
        left: -100px;
        animation-duration: 18s;
      }
      .orb2 {
        width: 260px;
        height: 260px;
        background: rgba(245, 166, 35, 0.18);
        bottom: 60px;
        right: -60px;
        animation-duration: 14s;
        animation-direction: reverse;
      }
      .orb3 {
        width: 180px;
        height: 180px;
        background: rgba(120, 50, 220, 0.3);
        top: 40%;
        left: 55%;
        animation-duration: 22s;
      }
      @keyframes float {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        33% {
          transform: translate(30px, -20px) scale(1.05);
        }
        66% {
          transform: translate(-20px, 25px) scale(0.97);
        }
      }

      /* ── GRID LINES ── */
      .grid {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 60px 60px;
      }

      /* ── LAYOUT ── */
      .page {
        position: relative;
        z-index: 2;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        text-align: center;
      }

      /* ── LOGO ── */
      .logo-wrap {
        margin-bottom: 36px;
        animation: fadeDown 0.8s ease both;
      }
      .logo-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 90px;
        height: 90px;
        border-radius: 22px;
        background: linear-gradient(135deg, #3b1280 0%, #5c2bb5 100%);
        box-shadow:
          0 0 0 1px rgba(245, 166, 35, 0.25),
          0 12px 40px rgba(0, 0, 0, 0.5);
        margin-bottom: 14px;
        position: relative;
        overflow: hidden;
      }
      .logo-icon::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(245, 166, 35, 0.12) 0%,
          transparent 60%
        );
      }
      .logo-icon .slash {
        position: absolute;
        width: 2px;
        height: 70%;
        background: var(--gold);
        transform: rotate(20deg);
        opacity: 0.9;
      }
      .logo-icon .letter {
        font-size: 32px;
        font-weight: 900;
        line-height: 1;
        color: var(--white);
        position: relative;
        z-index: 1;
      }
      .logo-icon .letter-d {
        margin-left: -10px;
      }
      .logo-icon .letter-c {
        color: rgba(255, 255, 255, 0.7);
      }
      .logo-text {
        font-size: 30px;
        font-weight: 900;
        letter-spacing: 1px;
      }
      .logo-text .dev {
        color: var(--white);
      }
      .logo-text .core {
        color: var(--gold);
      }

      /* ── BADGE ── */
      .badge-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(245, 166, 35, 0.12);
        border: 1px solid rgba(245, 166, 35, 0.3);
        border-radius: 100px;
        padding: 6px 18px;
        font-size: 13px;
        font-weight: 600;
        color: var(--gold-light);
        margin-bottom: 24px;
        animation: fadeDown 0.9s 0.1s ease both;
      }
      .badge-pill .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--gold);
        box-shadow: 0 0 6px var(--gold);
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      /* ── HEADLINE ── */
      h1 {
        /*  font-size: clamp(38px, 7vw, 72px);*/
        font-weight: 900;
        line-height: 1.15;
        margin-bottom: 18px;
        animation: fadeDown 0.9s 0.15s ease both;
      }
      h1 .highlight {
        background: linear-gradient(
          90deg,
          var(--gold) 0%,
          var(--gold-light) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .subtitle {
        font-size: clamp(15px, 2.2vw, 18px);
        color: var(--white-muted);
        max-width: 520px;
        line-height: 1.8;
        margin-bottom: 44px;
        animation: fadeDown 0.9s 0.2s ease both;
      }

      /* ── SERVICES CHIPS ── */
      .services-wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        margin-bottom: 52px;
        animation: fadeUp 0.9s 0.4s ease both;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 100px;
        padding: 8px 18px;
        font-size: 13px;
        font-weight: 600;
        transition:
          background 0.3s,
          border-color 0.3s,
          transform 0.3s;
      }
      .chip:hover {
        background: rgba(245, 166, 35, 0.1);
        border-color: rgba(245, 166, 35, 0.3);
        transform: translateY(-2px);
      }
      .chip i {
        color: var(--gold);
        font-size: 14px;
      }

      /* ── SOCIAL ── */
      .social-wrap {
        display: flex;
        gap: 14px;
        animation: fadeUp 0.9s 0.45s ease both;
      }
      .social-btn {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: var(--white);
        text-decoration: none;
        font-size: 18px;
        transition:
          background 0.3s,
          border-color 0.3s,
          transform 0.3s,
          color 0.3s;
      }
      .social-btn:hover {
        transform: translateY(-3px);
      }
      .social-btn.wa:hover {
        background: rgba(37, 211, 102, 0.15);
        border-color: rgba(37, 211, 102, 0.4);
        color: #25d366;
      }
      .social-btn.fb:hover {
        background: rgba(66, 103, 178, 0.2);
        border-color: rgba(66, 103, 178, 0.5);
        color: #4267b2;
      }
      .social-btn.em:hover {
        background: rgba(245, 166, 35, 0.1);
        border-color: rgba(245, 166, 35, 0.3);
        color: var(--gold);
      }

      /* ── FOOTER NOTE ── */
      .footer-note {
        position: fixed;
        bottom: 18px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.25);
        z-index: 2;
      }
      .footer-note .dev {
        color: rgba(255, 255, 255, 0.5);
        font-weight: 700;
      }
      .footer-note .core {
        color: rgba(245, 166, 35, 0.6);
        font-weight: 700;
      }

      /* ── ANIMATIONS ── */
      @keyframes fadeDown {
        from {
          opacity: 0;
          transform: translateY(-18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ── PROGRESS BAR ── */
      .progress-wrap {
        width: min(380px, 90%);
        margin-bottom: 14px;
        animation: fadeUp 0.9s 0.28s ease both;
      }
      .progress-label {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        font-weight: 600;
        color: var(--white-muted);
        margin-bottom: 8px;
      }
      .progress-label span:last-child {
        color: var(--gold);
      }
      .progress-bar-bg {
        height: 6px;
        border-radius: 100px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }
      .progress-bar-fill {
        height: 100%;
        border-radius: 100px;
        background: linear-gradient(90deg, var(--purple-light), var(--gold));
        width: 0%;
        transition: width 1.8s cubic-bezier(0.4, 0, 0.2, 1);
      }
    </style>
  </head>
  <body>
    <!-- Background -->
    <div class="bg-wrap">
      <div class="orb orb1"></div>
      <div class="orb orb2"></div>
      <div class="orb orb3"></div>
    </div>
    <div class="grid"></div>
    <!-- Page -->
    <div class="page">
      <!-- Logo -->
      <div class="logo-wrap">
        <div class="logo-text">
          <span class="dev">Dev</span>
          <span class="core">Core</span>
        </div>
      </div>
      <!-- Badge -->
      <div class="badge-pill">
        <span class="dot"></span>
        قيد التطوير الآن
      </div>
      <!-- Headline -->
      <h1>
        شيء
        <span class="highlight">رائع</span>
        قادم قريباً
      </h1>
      <p class="subtitle">
        نعمل بجد على موقعنا الجديد لنقدم لك تجربة استثنائية.
        <br />
        ترقّب الإطلاق وكن أول من يعلم!
      </p>
      <!-- Services -->
      <div class="services-wrap">
        <div class="chip">
          <i class="fa fa-mobile-screen"></i>
          تطبيقات موبايل
        </div>
        <div class="chip">
          <i class="fa fa-globe"></i>
          تطبيقات ويب
        </div>
        <div class="chip">
          <i class="fa fa-pen-nib"></i>
          Graphic Design
        </div>
        <div class="chip">
          <i class="fa fa-share-nodes"></i>
          Social Media
        </div>
      </div>
      <!-- Social -->
      <div class="social-wrap">
        <a
          href="https://wa.me/201558200078"
          target="_blank"
          class="social-btn wa"
          title="واتساب"
        >
          <i class="fab fa-whatsapp"></i>
        </a>
        <a
          href="https://www.facebook.com/DevCoreAgency"
          target="_blank"
          class="social-btn fb"
          title="فيسبوك"
        >
          <i class="fab fa-facebook-f"></i>
        </a>
        <a
          href="https://www.instagram.com/devcore.software/"
          target="_blank"
          class="social-btn ig"
          title="انستجرام"
        >
          <i class="fab fa-instagram"></i>
        </a>
        <a
          href="mailto:devcore.tech.info@gmail.com"
          class="social-btn em"
          title="إيميل"
        >
          <i class="fa fa-envelope"></i>
        </a>
      </div>
    </div>
    <!-- Footer -->
    <div class="footer-note">
      &copy; 2026
      <span class="dev">Dev</span>
      <span class="core">Core</span>
      — جميع الحقوق محفوظة
    </div>
    <script>
      // ── PROGRESS BAR ──
      const pct = 72;
      setTimeout(() => {
        document.getElementById("progressFill").style.width = pct + "%";
        document.getElementById("progressPct").textContent = pct + "%";
      }, 600);
    </script>
  </body>
</html>
